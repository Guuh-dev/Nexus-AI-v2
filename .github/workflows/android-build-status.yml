name: Nexus Android Build Status

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact commit of the existing EAS build to inspect
        required: true
        type: string

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - name: Install frozen project dependencies
        run: pnpm install --frozen-lockfile
      - name: Inspect the existing build only
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$BUILD_COMMIT" =~ ^[[:xdigit:]]{40}$ ]] || { echo "Invalid commit hash." >&2; exit 1; }
          test -n "$EXPO_TOKEN"
          pnpm dlx eas-cli@20.5.1 build:list --platform android --limit 10 --non-interactive --json > build-list.json
          node <<'JS'
          const fs = require('node:fs');
          const builds = JSON.parse(fs.readFileSync('build-list.json', 'utf8'));
          const matches = builds.filter(b => b.gitCommitHash === process.env.BUILD_COMMIT);
          if (!matches.length) throw new Error('No existing EAS build for this commit.');
          const status = matches.map(({ id, status, createdAt, completedAt, gitCommitHash, appBuildVersion, appVersion, runtimeVersion, buildProfile, channel, artifacts }) => ({ id, status, createdAt, completedAt, gitCommitHash, appBuildVersion, appVersion, runtimeVersion, buildProfile, channel, artifacts: artifacts ? { buildUrl: artifacts.buildUrl, applicationArchiveUrl: artifacts.applicationArchiveUrl } : undefined }));
          fs.writeFileSync('build-status.json', JSON.stringify(status, null, 2));
          for (const b of status) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Existing EAS build ${b.id}: ${b.status}; commit ${b.gitCommitHash}; versionCode ${b.appBuildVersion}.\n`);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-existing-build-status
          path: build-status.json
          retention-days: 14
